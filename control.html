<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Control Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212; color: #ffffff;
            font-family: Arial, sans-serif; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .control-container {
            width: 100%; max-width: 600px;
            background: #1e1e1e; padding: 20px;
            border-radius: 8px; border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 20px;
        }
        .section {
            background: #252525; padding: 15px; border-radius: 6px;
            border: 1px solid #444; display: flex; flex-direction: column; gap: 10px;
        }
        h2 { font-size: 16px; color: #1890ff; margin-bottom: 5px; }
        label { font-size: 13px; color: #ccc; }
        input, select {
            width: 100%; padding: 8px 12px; background: #111;
            border: 1px solid #555; color: #fff; border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px; background: #1890ff; color: #white; border: none;
            border-radius: 4px; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #40a9ff; }
        .btn-danger { background: #ff4d4f; }
        .btn-danger:hover { background: #ff7875; }
    </style>
</head>
<body>

    <div class="control-container">
        <!-- Pengaturan Host -->
        <div class="section">
            <h2>Kontrol Host</h2>
            <label>Nama Host:</label>
            <input type="text" id="hostNameInput" placeholder="Masukkan nama host...">
            <button onclick="updateHostName()">Simpan Nama Host</button>
            
            <label>Video Background Host (MP4):</label>
            <input type="file" id="hostVideoFile" accept="video/mp4">
            <button onclick="updateHostVideo()">Putar Video Host</button>
        </div>

        <!-- Pengaturan Video Latar Belakang (Bersuara) -->
        <div class="section">
            <h2>Upload Video Latar Belakang (Bersuara):</h2>
            <label>Pilih File Video:</label>
            <input type="file" id="gsVideoFile" accept="video/mp4">
            
            <label>Pilih Kotak Target untuk Video Ini:</label>
            <select id="gsVideoSlot">
                <option value="1">Kotak 1</option>
                <option value="2">Kotak 2</option>
                <option value="3">Kotak 3</option>
                <option value="4">Kotak 4</option>
            </select>

            <label>Pilih Jumlah & Gift Otomatis:</label>
            <select id="gsGiftSelect" onchange="syncGiftSelection()">
                <option value="" data-name="" data-points="0">-- Pilih Gift / Poin --</option>
                <option value="9a586391fbb1e21621c4203e5563a9e0~tplv-obj.webp" data-name="Adam's Dream" data-points="1000">Adam's Dream (1K)</option>
                <option value="8520d47b59c202a4534c1560a355ae06~tplv-obj.webp" data-name="Antar Bintang" data-points="5000">Antar Bintang (5K)</option>
                <option value="89b4d1d93c1cc614e3a0903ac7a94e0c~tplv-obj.webp" data-name="Dragon Flame" data-points="10000">Dragon Flame (10K)</option>
                <option value="bfb8425a7e8fa03f9fec05a973a4a506.png~tplv-obj.webp" data-name="Fire Phoenix" data-points="25000">Fire Phoenix (25K)</option>
                <option value="291de897e4a8c3b72c358a9734c5b7d8.png~tplv-obj.webp" data-name="Kota Masa Depan" data-points="42999">Kota Masa Depan (42.999)</option>
                <option value="2493534c2e9d914e6b503c3a836e72e9.png~tplv-obj.webp" data-name="Legend Marcellus" data-points="50000">Legend Marcellus (50K)</option>
                <option value="f600a2495ab5d250e7da2066484a9383.png~tplv-obj.webp" data-name="Pegasus" data-points="100000">Pegasus (100K)</option>
                <option value="e7ce188da898772f18aaffe49a7bd7db~tplv-obj.webp" data-name="Red Lightning" data-points="500000">Red Lightning (500K)</option>
                <option value="4fb89af2082a290b37d704e20f4fe729~tplv-obj.webp" data-name="Singa" data-points="1000000">Singa (1M)</option>
                <option value="26f3fbcda383e6093a19b8e7351a164c~tplv-obj.webp" data-name="Thunder Falcon" data-points="5000000">Thunder Falcon (5M)</option>
                <option value="8f471afbcebfda3841a6cc515e381f58~tplv-obj.webp" data-name="TikTok Universe" data-points="34999">TikTok Universe (34.999)</option>
            </select>
            
            <button onclick="triggerBackgroundVideo()">Tampilkan Video Latar Belakang</button>
        </div>

        <!-- Pengaturan Slot Target (1 - 4) -->
        <div class="section">
            <h2>Kontrol Slot Tamu (1 - 4)</h2>
            <label>Pilih Slot Target (1 - 4):</label>
            <select id="targetSlot">
                <option value="1">Kotak 1</option>
                <option value="2">Kotak 2</option>
                <option value="3">Kotak 3</option>
                <option value="4">Kotak 4</option>
            </select>

            <label>Username / Nama Tamu:</label>
            <input type="text" id="targetName" placeholder="Masukkan nama tamu...">

            <label>Link Foto Profil Tamu:</label>
            <input type="text" id="targetPhoto" placeholder="Masukkan URL foto profil...">

            <button onclick="updateSlotUser()">Set / Ganti Tamu di Slot</button>
            <button class="btn-danger" onclick="clearSlotUser()">Kosongkan Slot</button>
        </div>

        <!-- Tambah Poin Manual / Gift -->
        <div class="section">
            <h2>Tambah Poin / Gift ke Slot</h2>
            <label>Pilih Slot:</label>
            <select id="pointSlot">
                <option value="1">Kotak 1</option>
                <option value="2">Kotak 2</option>
                <option value="3">Kotak 3</option>
                <option value="4">Kotak 4</option>
            </select>

            <label>Pilih Gift Resmi (Otomatis Nama, Icon, & Poin):</label>
            <select id="manualGiftSelect" onchange="syncManualGift()">
                <option value="" data-name="" data-points="0" data-url="">-- Pilih Gift --</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/9a586391fbb1e21621c4203e5563a9e0~tplv-obj.webp" data-name="Adam's Dream" data-points="1000">Adam's Dream (1K)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8520d47b59c202a4534c1560a355ae06~tplv-obj.webp" data-name="Antar Bintang" data-points="5000">Antar Bintang (5K)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/89b4d1d93c1cc614e3a0903ac7a94e0c~tplv-obj.webp" data-name="Dragon Flame" data-points="10000">Dragon Flame (10K)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/bfb8425a7e8fa03f9fec05a973a4a506.png~tplv-obj.webp" data-name="Fire Phoenix" data-points="25000">Fire Phoenix (25K)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/291de897e4a8c3b72c358a9734c5b7d8.png~tplv-obj.webp" data-name="Kota Masa Depan" data-points="42999">Kota Masa Depan (42.999)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/2493534c2e9d914e6b503c3a836e72e9.png~tplv-obj.webp" data-name="Legend Marcellus" data-points="50000">Legend Marcellus (50K)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/f600a2495ab5d250e7da2066484a9383.png~tplv-obj.webp" data-name="Pegasus" data-points="100000">Pegasus (100K)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/e7ce188da898772f18aaffe49a7bd7db~tplv-obj.webp" data-name="Red Lightning" data-points="500000">Red Lightning (500K)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4fb89af2082a290b37d704e20f4fe729~tplv-obj.webp" data-name="Singa" data-points="1000000">Singa (1M)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/26f3fbcda383e6093a19b8e7351a164c~tplv-obj.webp" data-name="Thunder Falcon" data-points="5000000">Thunder Falcon (5M)</option>
                <option value="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8f471afbcebfda3841a6cc515e381f58~tplv-obj.webp" data-name="TikTok Universe" data-points="34999">TikTok Universe (34.999)</option>
            </select>

            <label>Jumlah Poin / Angka (Mendukung K dan M, misal: 100K, 1.5M, atau 42999):</label>
            <input type="text" id="addPointsInput" placeholder="Contoh: 100K atau 42999">

            <button onclick="addPointsToSlot()">Kirim Poin & Gift ke Slot</button>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        function updateHostName() {
            const name = document.getElementById('hostNameInput').value;
            channel.postMessage({ type: 'UPDATE_HOST_USER', data: name });
        }

        function updateHostVideo() {
            const fileInput = document.getElementById('hostVideoFile');
            if (fileInput.files && fileInput.files[0]) {
                const url = URL.createObjectURL(fileInput.files[0]);
                channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: url });
            }
        }

        function syncGiftSelection() {
            const select = document.getElementById('gsGiftSelect');
            const selectedOpt = select.options[select.selectedIndex];
            const points = selectedOpt.getAttribute('data-points');
            if (points && points !== "0") {
                document.getElementById('addPointsInput').value = points;
            }
        }

        function syncManualGift() {
            const select = document.getElementById('manualGiftSelect');
            const selectedOpt = select.options[select.selectedIndex];
            const points = selectedOpt.getAttribute('data-points');
            if (points && points !== "0") {
                document.getElementById('addPointsInput').value = points;
            }
        }

        function triggerBackgroundVideo() {
            const fileInput = document.getElementById('gsVideoFile');
            const slot = document.getElementById('gsVideoSlot').value;
            if (fileInput.files && fileInput.files[0]) {
                const url = URL.createObjectURL(fileInput.files[0]);
                channel.postMessage({ type: 'UPDATE_GS_VIDEO', slot: slot, url: url });
            }
        }

        function updateSlotUser() {
            const slot = document.getElementById('targetSlot').value;
            const name = document.getElementById('targetName').value;
            const photo = document.getElementById('targetPhoto').value;
            channel.postMessage({ type: 'UPDATE_TARGET_SLOT', data: { slot, name, photo, clear: false } });
        }

        function clearSlotUser() {
            const slot = document.getElementById('targetSlot').value;
            channel.postMessage({ type: 'UPDATE_TARGET_SLOT', data: { slot, clear: true } });
        }

        function addPointsToSlot() {
            const slot = document.getElementById('pointSlot').value;
            const addPoints = document.getElementById('addPointsInput').value;
            const manualSelect = document.getElementById('manualGiftSelect');
            const giftIcon = manualSelect.value;
            const selectedOpt = manualSelect.options[manualSelect.selectedIndex];
            const giftName = selectedOpt.getAttribute('data-name');

            channel.postMessage({ 
                type: 'ADD_POINTS_TO_SLOT', 
                data: { slot, addPoints, giftIcon, giftName } 
            });
        }
    </script>
</body>
</html>
