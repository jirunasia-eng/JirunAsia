let offCanvas = null;

let mask = null;
let queue = null;
let procW = 0;
let procH = 0;

    const bitmap = e.data.bitmap;

        const vw = bitmap.width;

        for (let v = 0; v < 256; v++) {
            acc += hist[v];
            if (acc >= total * 0.95) { t = v + 12; break; }

            const i = p * 4;
            const mx = Math.max(data[i], data[i + 1], data[i + 2]);

        }

        let qe = 0;

            if (mask[p] === 1) { mask[p] = 2; queue[qe++] = p; }

                    (y > 0 && mask[p - w] === 2) ||
                    (y < h - 1 && mask[p + w] === 2);
                if (nb) mask[p] = 2;

                    (y > 0 && mask[p - w] === 2) ||
                    (y < h - 1 && mask[p + w] === 2);
                if (isEdge && mx < t + F) {
                    let a = ((mx - t) / F) * 255;
                    if (a < 0) a = 0;
                    if (a > 255) a = 255;
                    data[i + 3] = a;

                workerReady = true;
            } catch (e) {
                workerReady = false;
            }
        }
        setupChromaWorker();

        // Canvas cadangan (browser lama) - kualitas tetap dijaga
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        function initCanvasResolution() {
            const rect = wrapperContainer.getBoundingClientRect();
            targetWidth = Math.round(rect.width) || 495;
            targetHeight = Math.round(rect.height) || 880;

            const dpr = window.devicePixelRatio || 1;
            animCanvas.width = Math.round(targetWidth * dpr);
            animCanvas.height = Math.round(targetHeight * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        }
        
        window.addEventListener('resize', initCanvasResolution);
        initCanvasResolution();

        // Algoritma sama seperti worker - untuk fallback browser lama
        function keyFrameFallback(data, w, h) {
            const len = w * h;
            const mask = new Uint8Array(len);
            const queue = new Int32Array(len);

            const hist = new Int32Array(256);
            const bump = (p) => {
                const i = p * 4;
                hist[Math.max(data[i], data[i + 1], data[i + 2])]++;
            };
            for (let x = 0; x < w; x++) { bump(x); bump((h - 1) * w + x); }
            for (let y = 0; y < h; y++) { bump(y * w); bump(y * w + w - 1); }
            const total = 2 * w + 2 * h;
            let acc = 0, t = 40;
            for (let v = 0; v < 256; v++) {
                acc += hist[v];
                if (acc >= total * 0.95) { t = v + 12; break; }
            }
            if (t < 30) t = 30;
            if (t > 80) t = 80;

            for (let p = 0; p < len; p++) {
                const i = p * 4;
                mask[p] = (Math.max(data[i], data[i + 1], data[i + 2]) <= t) ? 1 : 0;
            }

            let qs = 0, qe = 0;
            const push = (p) => { if (mask[p] === 1) { mask[p] = 2; queue[qe++] = p; } };
            for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
            for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
            while (qs < qe) {
                const p = queue[qs++];
                const x = p % w;
                if (x > 0) push(p - 1);
                if (x < w - 1) push(p + 1);
                if (p >= w) push(p - w);
                if (p + w < len) push(p + w);
            }

            for (let y = 0; y < h; y++) {
                const row = y * w;
                for (let x = 0; x < w; x++) {
                    const p = row + x;
                    if (mask[p] !== 0) continue;
                    const i = p * 4;
                    if (Math.max(data[i], data[i + 1], data[i + 2]) > t + 2) continue;
                    const nb =
                        (x > 0 && mask[p - 1] === 2) ||
                        (x < w - 1 && mask[p + 1] === 2) ||
                        (y > 0 && mask[p - w] === 2) ||
                        (y < h - 1 && mask[p + w] === 2);
                    if (nb) mask[p] = 2;
                }
            }

            const F = 50;
            for (let y = 0; y < h; y++) {
                const row = y * w;
                for (let x = 0; x < w; x++) {
                    const p = row + x;
                    const i = p * 4;
                    if (mask[p] === 2) { data[i + 3] = 0; continue; }
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (g > 100 && g > r * 1.3 && g > b * 1.3) { data[i + 3] = 0; continue; }
                    const mx = Math.max(r, g, b);
                    const isEdge =
                        (x > 0 && mask[p - 1] === 2) ||
                        (x < w - 1 && mask[p + 1] === 2) ||
                        (y > 0 && mask[p - w] === 2) ||
                        (y < h - 1 && mask[p + w] === 2);
                    if (isEdge && mx < t + F) {
                        data[i + 3] = Math.max(0, Math.min(255, ((mx - t) / F) * 255));
                    } else {
                        data[i + 3] = 255;
                    }
                }
            }
        }

        function setupOffscreen() {
            const vw = uploadVideoSource.videoWidth || targetWidth;
            const vh = uploadVideoSource.videoHeight || targetHeight;
            const cap = Math.min(1, 960 / Math.max(vw, vh));
            offCanvas.width = Math.max(1, Math.round(vw * cap));
            offCanvas.height = Math.max(1, Math.round(vh * cap));
        }

        // Gambar hasil key ke layar (cover fit) dengan smoothing kualitas tinggi
        function drawChromaResult(source, srcW, srcH) {
            const scale = Math.max(targetWidth / srcW, targetHeight / srcH);
            const drawW = srcW * scale;
            const drawH = srcH * scale;
            const drawX = (targetWidth - drawW) / 2;
            const drawY = (targetHeight - drawH) / 2;

            ctx.clearRect(0, 0, targetWidth, targetHeight);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(source, drawX, drawY, drawW, drawH);
        }

        // Jalur utama: Worker resolusi penuh (tajam maksimal)
        function processFrameFullQuality() {
            if (!workerReady || workerBusy) return;
            const vw = uploadVideoSource.videoWidth;
            const vh = uploadVideoSource.videoHeight;
            if (!vw || !vh) return;

            workerBusy = true;
            createImageBitmap(uploadVideoSource).then((bmp) => {
                chromaWorker.postMessage({ bitmap: bmp }, [bmp]);
            }).catch(() => {
                workerBusy = false;
                processFrameFallback();
            });
        }

        // Jalur cadangan: main thread (browser lama)
        function processFrameFallback() {
            if (offCanvas.width === 0) setupOffscreen();

            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.drawImage(uploadVideoSource, 0, 0, offCanvas.width, offCanvas.height);

            const frame = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            keyFrameFallback(frame.data, offCanvas.width, offCanvas.height);
            offCtx.putImageData(frame, 0, 0);

            drawChromaResult(offCanvas, offCanvas.width, offCanvas.height);
        }

        // Loop: proses hanya saat video mengeluarkan frame baru (anti patah-patah)
        function scheduleNextFrame() {
            if (!chromaRunning) return;
            if (typeof uploadVideoSource.requestVideoFrameCallback === 'function') {
                uploadVideoSource.requestVideoFrameCallback(() => {
                    if (!chromaRunning) return;
                    if (uploadVideoSource.readyState >= 2 && !uploadVideoSource.paused && !uploadVideoSource.ended) {
                        if (workerReady) processFrameFullQuality();
                        else processFrameFallback();
                    }
                    scheduleNextFrame();
                });
            } else {
                animFrameId = requestAnimationFrame(() => {
                    if (!chromaRunning) return;
                    if (uploadVideoSource.readyState >= 2 && !uploadVideoSource.paused && !uploadVideoSource.ended) {
                        if (workerReady) processFrameFullQuality();
                        else processFrameFallback();
                    }
                    scheduleNextFrame();
                });
            }
        }

        function startChromaLoop() {
            if (chromaRunning) return;
            chromaRunning = true;
            workerBusy = false;
            scheduleNextFrame();
        }

        function stopChromaLoop(clearScreen) {
            chromaRunning = false;
            workerBusy = false;
            if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
            if (clearScreen) ctx.clearRect(0, 0, targetWidth, targetHeight);
        }

        uploadVideoSource.addEventListener('play', startChromaLoop);
        uploadVideoSource.addEventListener('playing', startChromaLoop);

        uploadVideoSource.addEventListener('ended', () => {
            stopChromaLoop(true);
            uploadVideoSource.pause();
            try { uploadVideoSource.currentTime = 0; } catch (e) {}
        });

        function playVideoSafely(video) {
            video.muted = false;
            const p = video.play();
            if (p && typeof p.catch === 'function') {
                p.catch(() => {
                    video.muted = true;
                    const p2 = video.play();
                    if (p2 && typeof p2.catch === 'function') p2.catch(() => {});
                });
            }
        }

        function parseFlexiblePoints(val) {
            if (val === undefined || val === null) return 0;
            let str = String(val).trim().toUpperCase();
            let multiplier = 1;

            if (str.endsWith('K')) { 
                multiplier = 1000; 
                str = str.slice(0, -1); 
            } else if (str.endsWith('M')) { 
                multiplier = 1000000; 
                str = str.slice(0, -1); 
            }

            str = str.replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? 0 : Math.round(num * multiplier);
        }

        function formatDisplayPoints(total) {
            if (total >= 1000000) {
                let mVal = total / 1000000;
                return mVal.toFixed(1).replace('.', ',') + 'M';
            } else if (total >= 1000) {
                let kVal = total / 1000;
                return kVal.toFixed(1).replace('.', ',') + 'K';
            }
            return total.toLocaleString('id-ID');
        }

        function formatShortName(name) {
            if (!name) return "";
            if (name.length > 8) {
                let halfLength = Math.ceil(name.length / 2);
                return name.substring(0, halfLength) + "...";
            }
            return name;
        }

        channel.onmessage = (event) => {
            const { type, data, url } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                try { bgVideo.pause(); } catch (e) {}
                try { bgVideo.currentTime = 0; } catch (e) {}
                bgVideo.style.display = 'block';
                bgVideo.src = url;
                bgVideo.load();
                playVideoSafely(bgVideo);
            }

            if (type === 'UPDATE_GS_VIDEO') {
                stopChromaLoop(true);
                try { uploadVideoSource.pause(); } catch (e) {}
                try { uploadVideoSource.currentTime = 0; } catch (e) {}
                uploadVideoSource.src = url;
                uploadVideoSource.load();
                playVideoSafely(uploadVideoSource);
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                const micSvgHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        <line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                `;

                if (data.clear) {
                    slotEl.dataset.points = "0";
                    slotEl.classList.remove('active-slot');
                    slotEl.innerHTML = `
                        <div class="slot-star-number-group" style="display: none;">
                            <div class="slot-star-circle-small"><span class="star-icon">★</span></div>
                            <div class="slot-number-text">0</div>
                        </div>
                        <img class="gift-popup-effect" alt="Gift Popup">
                        <div class="mic-icon-bottom-right" style="display: none;">${micSvgHTML}</div>
                        <span class="plus">+</span><span class="label">Permintaan</span>
                    `;
                } else {
                    slotEl.dataset.points = "0";
                    slotEl.classList.add('active-slot');
                    const processedName = formatShortName(data.name);
                    slotEl.innerHTML = `
                        <div class="slot-star-number-group" style="display: flex;">
                            <div class="slot-star-circle-small"><span class="star-icon">★</span></div>
                            <div class="slot-number-text">0</div>
                        </div>
                        <img class="gift-popup-effect" alt="Gift Popup">
                        <div class="mic-icon-bottom-right" style="display: flex;">${micSvgHTML}</div>
                        <div class="slot-content"><img src="${data.photo}" class="slot-avatar" alt="Avatar"></div>
                        <div class="slot-name-bottom"><span class="name-text">${processedName}</span><span class="plus-icon-large">✚</span></div>
                    `;
                }
            }

            if (type === 'ADD_POINTS_TO_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                let pointToAdd = data.addPoints;
                if (data.giftName === "Kota Masa Depan" && (!pointToAdd || parseFlexiblePoints(pointToAdd) === 0)) {
                    pointToAdd = 6000;
                } else if ((data.giftName === "Legend Marcellus" || data.giftName === "Pegasus") && (!pointToAdd || parseFlexiblePoints(pointToAdd) === 0)) {
                    pointToAdd = 42999;
                }

                const addedValue = parseFlexiblePoints(pointToAdd);
                let currentPoints = parseInt(slotEl.dataset.points || "0") + addedValue;
                slotEl.dataset.points = currentPoints;

                const numberText = slotEl.querySelector('.slot-number-text');
                const groupEl = slotEl.querySelector('.slot-star-number-group');
                const giftPopup = slotEl.querySelector('.gift-popup-effect');

                if (numberText) numberText.innerText = formatDisplayPoints(currentPoints);
                if (groupEl) groupEl.style.display = 'flex';

                let resolvedGiftIcon = data.giftIcon;
                if (data.giftName && giftDatabase[data.giftName]) {
                    resolvedGiftIcon = giftDatabase[data.giftName];
                }

                if (giftPopup && resolvedGiftIcon) {
                    giftPopup.src = resolvedGiftIcon;
                    giftPopup.style.display = 'block';
                    giftPopup.style.animation = 'none';
                    void giftPopup.offsetWidth; 
                    giftPopup.style.animation = 'giftPopupAnim 3s ease forwards';
                }
            }
        };
    </script>
</body>
