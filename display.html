<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Potret TikTok Studio</title>
    <!-- Memuat Google Font Cormorant Garamond -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; width: 100%; }

        body {
            background-color: #0b0b0b; color: #ffffff;
            font-family: Arial, sans-serif; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            height: 100vh;
            min-height: 100vh;
        }

        /* ============ AREA PANGGUNG (memenuhi layar sampai BAWAH) ============ */
        .studio-stage {
            position: fixed; inset: 0;
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(1200px 600px at 50% 40%, rgba(37,244,238,0.04), transparent 60%),
                radial-gradient(1000px 500px at 50% 80%, rgba(254,44,85,0.04), transparent 60%),
                #0b0b0b;
        }

        /* ============ KOTAK DISPLAY POTRET ============ */
        .wrapper-9-16 {
            width: 495px;
            height: 880px;
            flex: none;
            background-color: transparent;
            display: flex; flex-direction: column; align-items: center;
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 0;
            box-shadow: none;
            transform-origin: center center;
        }

        /* ============ MODE PRATINJAU (tekan H) ============ */
        body.preview .wrapper-9-16 {
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 18px;
            box-shadow:
                0 0 0 6px #1c1d22,
                0 0 0 7px rgba(255,255,255,0.06),
                0 20px 70px rgba(0, 0, 0, 0.85);
        }

        /* 1. Video Host (Layer Belakang) */
        .bg-video-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
            background-color: #000;
        }

        /* 2. Canvas Animasi HD */
        .upload-canvas-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            display: block;
        }

        /* Kotak 1-8: segi-4 sempurna 140x140 (sama sisi) */
        .main-container {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
            padding: 0 12px;
        }

        .side-column {
            display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            gap: 8px;
        }

        .box {
            width: 140px;
            height: 140px;
            border: none;
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: rgba(20, 20, 20, 0.85);
            position: relative; overflow: visible;
            transition: background-color 0.3s ease;
        }

        .box.active-slot {
            background-color: rgba(50, 50, 50, 0.9);
        }

        .box .plus {
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            font-weight: 700;
            color: #b0b0b0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            line-height: 0.7;
            transform: scaleY(1.3);
            display: inline-block;
        }

        .box .label {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #b0b0b0;
            margin-top: 4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        .slot-star-number-group {
            position: absolute; top: 6px; left: 6px;
            z-index: 10; height: 20px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: none; align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            overflow: hidden;
            padding-right: 7px;
            gap: 4px;
        }

        .slot-star-circle-small {
            width: 14px; height: 14px;
            background-color: #1890ff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-left: 4px;
        }

        .slot-star-circle-small .star-icon {
            font-size: 8px; color: #ffffff; line-height: 1;
        }

        .slot-number-text {
            color: #ffffff;
            font-size: 10px; font-weight: bold;
            line-height: 1;
        }

        .gift-popup-effect {
            position: absolute; top: 6px; right: 6px;
            z-index: 20; width: 34px; height: 34px;
            object-fit: contain; display: none;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            animation: giftPopupAnim 3s ease forwards;
        }

        @keyframes giftPopupAnim {
            0% { opacity: 0; transform: scale(0.3) translateY(10px); }
            15% { opacity: 1; transform: scale(1.2) translateY(0); }
            30% { transform: scale(1); }
            80% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.8) translateY(-15px); }
        }

        /* Ikon mikrofon: DIPERBESAR 24px & SEJAJAR dengan badge nama
           (dasar sama: bottom 6px, tinggi sama: 24px -> garis tengah lurus) */
        .mic-icon-bottom-right {
            position: absolute; bottom: 6px; right: 6px;
            z-index: 10; width: 24px; height: 24px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            border: 1px solid #000000;
        }
        .mic-icon-bottom-right svg {
            width: 14px; height: 14px; fill: #ffffff;
        }

        .slot-content {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; background: transparent;
        }

        /* Foto target: BULAT SAJA — tanpa lingkaran/garis putih */
        .slot-avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 2px;
            border: none;
        }

        /* Badge nama: kapsul (ujung setengah bulat), kiri bawah
           Tinggi total = 16 (ikon +) + 4 + 4 (padding) = 24px -> SAMA dengan tinggi mikrofon */
        .slot-name-bottom {
            position: absolute; bottom: 6px; left: 6px;
            z-index: 10; background-color: rgba(0, 0, 0, 0.75); color: #fff;
            font-size: 10px; font-weight: bold; padding: 4px 6px 4px 10px;
            border-radius: 999px;
            max-width: 85%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .slot-name-bottom .name-text {
            overflow: hidden; text-overflow: ellipsis; line-height: 1;
            display: inline-flex; align-items: center;
        }

        /* Ikon + : DIPERBESAR jadi 16x16, lingkaran abu, + putih pas di tengah */
        .slot-name-bottom .plus-icon-large {
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            background-color: #9e9e9e;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0;
            flex-shrink: 0;
            box-sizing: border-box;
        }
    </style>
</head>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        const bgVideo = document.getElementById('bgVideoLayer');
        const uploadVideoSource = document.getElementById('uploadVideoSource');
        const animCanvas = document.getElementById('animationCanvas');
        const wrapperContainer = document.getElementById('wrapperContainer');
        const studioStage = document.getElementById('studioStage');
        const ctx = animCanvas.getContext('2d', { willReadFrequently: true });

        const DESIGN_W = 495;
        const DESIGN_H = 880;

        // ============ PENGATUR LEBAR TAMPILAN ============
        // 1.0  = lebar proporsional 9:16, tinggi penuh sampai bawah (default)
        // 0.8  = lebih sempit lagi | 1.2 = lebih lebar (maks. selebar layar)
        const SKALA_LEBAR = 1.0;

        let animFrameId = null;
        let targetWidth = DESIGN_W;
        let targetHeight = DESIGN_H;

        // ============ SKALA DISPLAY ============
        // Skala SERAGAM. Tinggi tetap penuh sampai bawah,
        // lebar mengikuti rasio potret 9:16 (lebih sempit, kotak tetap persegi).
        function applyScale() {
            const preview = document.body.classList.contains('preview');

            if (preview) {
                const pad = 14;
                const s = Math.max(0.05, Math.min(
                    (studioStage.clientWidth - pad) / DESIGN_W,
                    (studioStage.clientHeight - pad) / DESIGN_H
                ));
                wrapperContainer.style.transform = `scale(${s})`;
            } else {
                const sTinggi = studioStage.clientHeight / DESIGN_H;
                const sLebarMaks = studioStage.clientWidth / DESIGN_W;
                const s = Math.min(
                    Math.max(0.05, sTinggi * SKALA_LEBAR),
                    Math.max(0.05, sLebarMaks)
                );
                wrapperContainer.style.transform = `scale(${s})`;
            }
            requestAnimationFrame(initCanvasResolution);
        }

        function initCanvasResolution() {
            const rect = wrapperContainer.getBoundingClientRect();
            targetWidth = DESIGN_W;
            targetHeight = DESIGN_H;

            const dpr = window.devicePixelRatio || 1;
            animCanvas.width = Math.max(1, Math.round(rect.width * dpr));
            animCanvas.height = Math.max(1, Math.round(rect.height * dpr));
            const ex = (rect.width / DESIGN_W) * dpr;
            const ey = (rect.height / DESIGN_H) * dpr;
            ctx.setTransform(ex, 0, 0, ey, 0, 0);
        }

        window.addEventListener('resize', applyScale);
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'h') { document.body.classList.toggle('preview'); applyScale(); }
            if (k === 'f') {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
                else document.exitFullscreen().catch(() => {});
            }
        });
        document.addEventListener('fullscreenchange', applyScale);

        applyScale();

        const giftDatabase = {
            "Adam's Dream": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/9a586391fbb1e21621c4203e5563a9e0~tplv-obj.webp",
            "Antar Bintang": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8520d47b59c202a4534c1560a355ae06~tplv-obj.webp",
            "Dragon Flame": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/89b4d1d93c1cc614e3a0903ac7a94e0c~tplv-obj.webp",
            "Fire Phoenix": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/bfb8425a7e8fa03f9fec05a973a4a506.png~tplv-obj.webp",
            "Kota Masa Depan": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/291de897e4a8c3b72c358a9734c5b7d8.png~tplv-obj.webp",
            "Legend Marcellus": "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/2493534c2e9d914e6b503c3a836e72e9.png~tplv-obj.webp",
            "Pegasus": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/f600a2495ab5d250e7da2066484a9383.png~tplv-obj.webp",
            "Red Lightning": "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/e7ce188da898772f18aaffe49a7bd7db~tplv-obj.webp",
            "Singa": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4fb89af2082a290b37d704e20f4fe729~tplv-obj.webp",
            "Thunder Falcon": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/26f3fbcda383e6093a19b8e7351a164c~tplv-obj.webp",
            "TikTok Universe": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8f471afbcebfda3841a6cc515e381f58~tplv-obj.webp"
        };

        // Chroma key memproses SELURUH buffer canvas (device pixel)
        function processChromaKeyAbsolute() {
            if (uploadVideoSource.readyState >= 2 && !uploadVideoSource.paused && !uploadVideoSource.ended) {
                const bufW = animCanvas.width;
                const bufH = animCanvas.height;

                ctx.clearRect(0, 0, bufW, bufH);

                const vWidth = uploadVideoSource.videoWidth || targetWidth;
                const vHeight = uploadVideoSource.videoHeight || targetHeight;

                const scale = Math.max(targetWidth / vWidth, targetHeight / vHeight);
                const drawW = vWidth * scale;
                const drawH = vHeight * scale;
                const drawX = (targetWidth - drawW) / 2;
                const drawY = (targetHeight - drawH) / 2;

                ctx.drawImage(uploadVideoSource, drawX, drawY, drawW, drawH);

                const frame = ctx.getImageData(0, 0, bufW, bufH);
                const data = frame.data;
                const len = data.length;

                for (let i = 0; i < len; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    const maxVal = Math.max(r, g, b);

                    if (maxVal <= 30) {
                        data[i + 3] = 0;
                    }
                    else if (maxVal < 70) {
                        data[i + 3] = Math.round(((maxVal - 30) / 40) * 255);
                    }
                    else {
                        data[i + 3] = 255;
                    }

                    if (g > 100 && g > r * 1.3 && g > b * 1.3) {
                        data[i + 3] = 0;
                    }
                }

                ctx.putImageData(frame, 0, 0);
                animFrameId = requestAnimationFrame(processChromaKeyAbsolute);
            }
        }

        function startChromaLoop() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(processChromaKeyAbsolute);
        }

        uploadVideoSource.addEventListener('play', startChromaLoop);
        uploadVideoSource.addEventListener('playing', startChromaLoop);

        uploadVideoSource.addEventListener('ended', () => {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = null;
            uploadVideoSource.pause();
            try { uploadVideoSource.currentTime = 0; } catch (e) {}
            ctx.clearRect(0, 0, animCanvas.width, animCanvas.height);
        });

        function playVideoSafely(video) {
            video.muted = false;
            const p = video.play();
            if (p && typeof p.catch === 'function') {
                p.catch(() => {
                    video.muted = true;
                    const p2 = video.play();
                    if (p2 && typeof p2.catch === 'function') p2.catch(() => {});
                });
            }
        }

        function parseFlexiblePoints(val) {
            if (val === undefined || val === null) return 0;
            let str = String(val).trim().toUpperCase();
            let multiplier = 1;

            if (str.endsWith('K')) {
                multiplier = 1000;
                str = str.slice(0, -1);
            } else if (str.endsWith('M')) {
                multiplier = 1000000;
                str = str.slice(0, -1);
            }

            str = str.replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? 0 : Math.round(num * multiplier);
        }

        function formatDisplayPoints(total) {
            if (total >= 1000000) {
                let mVal = total / 1000000;
                return mVal.toFixed(1).replace('.', ',') + 'M';
            } else if (total >= 1000) {
                let kVal = total / 1000;
                return kVal.toFixed(1).replace('.', ',') + 'K';
            }
            return total.toLocaleString('id-ID');
        }

        function formatShortName(name) {
            if (!name) return "";
            if (name.length > 8) {
                let halfLength = Math.ceil(name.length / 2);
                return name.substring(0, halfLength) + "...";
            }
            return name;
        }

        channel.onmessage = (event) => {
            const { type, data, url } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                try { bgVideo.pause(); } catch (e) {}
                try { bgVideo.currentTime = 0; } catch (e) {}
                bgVideo.style.display = 'block';
                bgVideo.src = url;
                bgVideo.load();
                playVideoSafely(bgVideo);
            }

            if (type === 'UPDATE_GS_VIDEO') {
                if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
                ctx.clearRect(0, 0, animCanvas.width, animCanvas.height);
                try { uploadVideoSource.pause(); } catch (e) {}
                try { uploadVideoSource.currentTime = 0; } catch (e) {}
                uploadVideoSource.src = url;
                uploadVideoSource.load();
                playVideoSafely(uploadVideoSource);
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                const micSvgHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        <line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                `;

                if (data.clear) {
                    slotEl.dataset.points = "0";
                    slotEl.dataset.name = "";
                    slotEl.classList.remove('active-slot');
                    slotEl.innerHTML = `
                        <div class="slot-star-number-group" style="display: none;">
                            <div class="slot-star-circle-small"><span class="star-icon">★</span></div>
                            <div class="slot-number-text">0</div>
                        </div>
                        <img class="gift-popup-effect" alt="Gift Popup">
                        <div class="mic-icon-bottom-right" style="display: none;">${micSvgHTML}</div>
                        <span class="plus">+</span><span class="label">Permintaan</span>
                    `;
                } else {
                    slotEl.dataset.points = "0";
                    slotEl.dataset.name = data.name || "";
                    slotEl.classList.add('active-slot');
                    const processedName = formatShortName(data.name);
                    slotEl.innerHTML = `
                        <div class="slot-star-number-group" style="display: flex;">
                            <div class="slot-star-circle-small"><span class="star-icon">★</span></div>
                            <div class="slot-number-text">0</div>
                        </div>
                        <img class="gift-popup-effect" alt="Gift Popup">
                        <div class="mic-icon-bottom-right" style="display: flex;">${micSvgHTML}</div>
                        <div class="slot-content"><img src="${data.photo}" class="slot-avatar" alt="Avatar"></div>
                        <div class="slot-name-bottom"><span class="name-text">${processedName}</span><span class="plus-icon-large">+</span></div>
                    `;
                }
            }

            if (type === 'ADD_POINTS_TO_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                let pointToAdd = data.addPoints;
                if (data.giftName === "Kota Masa Depan" && (!pointToAdd || parseFlexiblePoints(pointToAdd) === 0)) {
                    pointToAdd = 6000;
                } else if ((data.giftName === "Legend Marcellus" || data.giftName === "Pegasus") && (!pointToAdd || parseFlexiblePoints(pointToAdd) === 0)) {
                    pointToAdd = 42999;
                }

                const addedValue = parseFlexiblePoints(pointToAdd);
                let currentPoints = parseInt(slotEl.dataset.points || "0") + addedValue;
                slotEl.dataset.points = currentPoints;

                const numberText = slotEl.querySelector('.slot-number-text');
                const groupEl = slotEl.querySelector('.slot-star-number-group');
                const giftPopup = slotEl.querySelector('.gift-popup-effect');

                if (numberText) numberText.innerText = formatDisplayPoints(currentPoints);
                if (groupEl) groupEl.style.display = 'flex';

                let resolvedGiftIcon = data.giftIcon;
                if (data.giftName && giftDatabase[data.giftName]) {
                    resolvedGiftIcon = giftDatabase[data.giftName];
                }

                if (giftPopup && resolvedGiftIcon) {
                    giftPopup.src = resolvedGiftIcon;
                    giftPopup.style.display = 'block';
                    giftPopup.style.animation = 'none';
                    void giftPopup.offsetWidth;
                    giftPopup.style.animation = 'giftPopupAnim 3s ease forwards';
                }
            }
        };
    </script>
</body>
</html>
