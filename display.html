<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Display 8 Kotak TikTok Live</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100vw; height: 100vh; gap: 5px; padding: 5px; box-sizing: border-box;
        }
        .box {
            position: relative; background: #111; border: 2px solid #333;
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
        }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .overlay-info {
            position: relative; z-index: 2; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 10px; display: flex; align-items: center; justify-content: space-between;
        }
        .user-profile { display: flex; align-items: center; gap: 8px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #38bdf8; object-fit: cover; }
        .name { font-size: 14px; font-weight: bold; }
        .points-box { background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 12px; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .points-box img { width: 16px; height: 16px; }
    </style>
</head>
<body>

    <div class="grid-container" id="gridContainer">
        <!-- Generate 8 Kotak Otomatis -->
    </div>

    <script>
        const totalBoxes = 8;
        const container = document.getElementById('gridContainer');
        const stateData = {};

        // Inisialisasi 8 Kotak
        for (let i = 1; i <= totalBoxes; i++) {
            stateData[i] = { name: `Kotak ${i}`, photo: 'https://ui-avatars.com/api/?name=User&background=333&color=fff', points: 0, hostVideo: '', gsVideo: '' };
            
            const box = document.createElement('div');
            box.className = 'box';
            box.id = `box-${i}`;
            box.innerHTML = `
                <video id="vid-${i}" autoplay muted loop style="display:none;"></video>
                <div class="overlay-info">
                    <div class="user-profile">
                        <img src="${stateData[i].photo}" class="avatar" id="avatar-${i}">
                        <span class="name" id="name-${i}">${stateData[i].name}</span>
                    </div>
                    <div class="points-box">
                        <img id="gift-icon-${i}" src="" style="display:none;">
                        <span id="points-${i}">0 Poin</span>
                    </div>
                </div>
            `;
            container.appendChild(box);
        }

        const channel = new BroadcastChannel('live_control_channel_8box');
        channel.onmessage = (event) => {
            const { type, data, url, slot } = event.data;

            if (type === 'UPDATE_TARGET_SLOT') {
                const s = data.slot;
                if (data.clear) {
                    document.getElementById(`name-${s}`).innerText = `Kotak ${s}`;
                    document.getElementById(`avatar-${s}`).src = 'https://ui-avatars.com/api/?name=User&background=333&color=fff';
                } else {
                    document.getElementById(`name-${s}`).innerText = data.name;
                    document.getElementById(`avatar-${s}`).src = data.photo;
                }
            }
            else if (type === 'UPDATE_HOST_VIDEO') {
                // Terapkan video host ke semua kotak (atau ubah logika sesuai kebutuhan)
                for (let i = 1; i <= totalBoxes; i++) {
                    const vid = document.getElementById(`vid-${i}`);
                    vid.src = url;
                    vid.style.display = 'block';
                    vid.muted = true;
                    vid.play().catch(e => console.log(e));
                }
            }
            else if (type === 'UPDATE_GS_VIDEO') {
                const vid = document.getElementById(`vid-${slot}`);
                vid.src = url;
                vid.style.display = 'block';
                vid.muted = false; // Video utama bersuara
                vid.play().catch(e => console.log(e));
            }
            else if (type === 'ADD_POINTS_TO_SLOT') {
                const s = data.slot;
                const currentPts = parseInt(document.getElementById(`points-${s}`).innerText) || 0;
                const newTotal = currentPts + data.addPoints;
                document.getElementById(`points-${s}`).innerText = newTotal.toLocaleString() + ' Poin';
                
                if (data.giftIcon) {
                    const iconEl = document.getElementById(`gift-icon-${s}`);
                    iconEl.src = data.giftIcon;
                    iconEl.style.display = 'inline-block';
                }
            }
        };
    </script>
</body>
</html>
