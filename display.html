<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - 8 Slots Layout (9:16)</title>
    <!-- Memuat Google Font Cormorant Garamond -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0b; color: #ffffff;
            font-family: Arial, sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
        }

        .wrapper-9-16 {
            width: 495px;
            height: 880px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 1px solid #333;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* 1. Layer Video Host (Paling Belakang, Berputar Berulang-ulang) */
        .bg-video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; 
            display: none;
            background-color: #000;
        }

        /* 2. Layer Video Animasi (Di depan layar, warna asli pekat/tajam, video host di belakang tetap nampak) */
        .upload-video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2; 
            display: none;
            background: transparent;
            pointer-events: none; /* Supaya klik mouse tetap tembus ke elemen UI di atasnya */
        }

        .main-container {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            z-index: 5; /* Berada di atas semua video */
            padding: 0 12px;
        }

        .side-column { 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center;
            gap: 8px; 
        }

        /* Ukuran Kotak 1-8 (Garis putih sudah dihilangkan) */
        .box {
            width: 115px; 
            height: 112px; 
            border: none; /* Garis putih dihapus */
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: rgba(20, 20, 20, 0.85);
            position: relative; overflow: visible;
            transition: background-color 0.3s ease;
        }

        .box.active-slot {
            background-color: rgba(50, 50, 50, 0.9);
        }

        .box .plus { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px; 
            font-weight: 700; 
            color: #b0b0b0; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.8); 
            line-height: 0.7;
            transform: scaleY(1.3);
            display: inline-block;
        }

        .box .label { 
            font-family: Arial, sans-serif;
            font-size: 12px; 
            font-weight: 700;
            color: #b0b0b0;
            margin-top: 4px; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.9); 
        }

        /* Badge Poin (Bintang & Angka Total) */
        .slot-star-number-group {
            position: absolute; top: 5px; left: 5px;
            z-index: 10; height: 18px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: none; align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            overflow: hidden;
            padding-right: 6px;
            gap: 3px;
        }

        .slot-star-circle-small {
            width: 12px; height: 12px;
            background-color: #1890ff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-left: 3px;
        }

        .slot-star-circle-small .star-icon {
            font-size: 6px; color: #ffffff; line-height: 1;
        }

        .slot-number-text {
            color: #ffffff;
            font-size: 9px; font-weight: bold;
            line-height: 1;
        }

        /* Efek Animasi Icon Gift Muncul di Kanan Atas Kotak */
        .gift-popup-effect {
            position: absolute; top: 5px; right: 5px;
            z-index: 20; width: 28px; height: 28px;
            object-fit: contain; display: none;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            animation: giftPopupAnim 3s ease forwards;
        }

        @keyframes giftPopupAnim {
            0% { opacity: 0; transform: scale(0.3) translateY(10px); }
            15% { opacity: 1; transform: scale(1.2) translateY(0); }
            30% { transform: scale(1); }
            80% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.8) translateY(-15px); }
        }

        /* Icon Mikrofon (Sejajar dengan barisan nama target) */
        .mic-icon-bottom-right {
            position: absolute; bottom: 5px; right: 5px;
            z-index: 10; width: 18px; height: 18px;
            background-color: rgba(0, 0, 0, 0.7); 
            border-radius: 50%; 
            display: none; align-items: center; justify-content: center;
            border: 1px solid #000000; 
        }
        .mic-icon-bottom-right svg {
            width: 10px; height: 10px; fill: #ffffff;
        }

        .slot-content {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; background: transparent;
        }
        
        .slot-avatar { 
            width: 50px; height: 50px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 2px; 
            border: 2px solid #fff; 
        }
        
        /* Barisan Nama Target */
        .slot-name-bottom {
            position: absolute; bottom: 5px; left: 5px;
            z-index: 10; background-color: rgba(0, 0, 0, 0.75); color: #fff;
            font-size: 9px; font-weight: bold; padding: 3px 7px 2px 7px; 
            border-radius: 10px; 
            max-width: 68%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .slot-name-bottom .name-text { 
            overflow: hidden; text-overflow: ellipsis; line-height: 1; 
            display: inline-flex; align-items: center; 
        }
        
        .slot-name-bottom .plus-icon-large { 
            font-family: Arial, sans-serif;
            font-size: 11px; 
            font-weight: bold; 
            color: #ffffff; 
            line-height: 1; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            position: relative;
            top: -0.5px; 
        }
    </style>
</head>
<body>

    <div class="wrapper-9-16">
        <!-- 1. Layer Video Host (Paling Belakang) -->
        <video class="bg-video-layer" id="bgVideoLayer" playsinline loop></video>
        
        <!-- 2. Layer Video Animasi (Di Depan Layar, Warna Asli Tetap Tajam & Pekat) -->
        <video class="upload-video-layer" id="uploadVideoLayer" playsinline></video>

        <div class="main-container">
            <!-- Kolom Kiri (Slot 1 sampai 4) -->
            <div class="side-column">
                <div class="box" id="slot-1" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
                <div class="box" id="slot-2" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
                <div class="box" id="slot-3" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
                <div class="box" id="slot-4" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
            </div>

            <!-- Kolom Kanan (Slot 5 sampai 8) -->
            <div class="side-column">
                <div class="box" id="slot-5" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
                <div class="box" id="slot-6" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
                <div class="box" id="slot-7" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
                <div class="box" id="slot-8" data-points="0">
                    <div class="slot-star-number-group"><div class="slot-star-circle-small"><span class="star-icon">★</span></div><div class="slot-number-text">0</div></div>
                    <img class="gift-popup-effect" alt="Gift Popup">
                    <div class="mic-icon-bottom-right"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/><line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="plus">+</span><span class="label">Permintaan</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        const bgVideo = document.getElementById('bgVideoLayer');       
        const uploadVideo = document.getElementById('uploadVideoLayer'); 

        const giftDatabase = {
            "Adam's Dream": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/9a586391fbb1e21621c4203e5563a9e0~tplv-obj.webp",
            "Antar Bintang": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8520d47b59c202a4534c1560a355ae06~tplv-obj.webp",
            "Dragon Flame": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/89b4d1d93c1cc614e3a0903ac7a94e0c~tplv-obj.webp",
            "Fire Phoenix": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/bfb8425a7e8fa03f9fec05a973a4a506.png~tplv-obj.webp",
            "Kota Masa Depan": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/291de897e4a8c3b72c358a9734c5b7d8.png~tplv-obj.webp",
            "Legend Marcellus": "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/2493534c2e9d914e6b503c3a836e72e9.png~tplv-obj.webp",
            "Pegasus": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/f600a2495ab5d250e7da2066484a9383.png~tplv-obj.webp",
            "Red Lightning": "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/e7ce188da898772f18aaffe49a7bd7db~tplv-obj.webp",
            "Singa": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4fb89af2082a290b37d704e20f4fe729~tplv-obj.webp",
            "Thunder Falcon": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/26f3fbcda383e6093a19b8e7351a164c~tplv-obj.webp",
            "TikTok Universe": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8f471afbcebfda3841a6cc515e381f58~tplv-obj.webp"
        };

        function parseFlexiblePoints(val) {
            if (val === undefined || val === null) return 0;
            let str = String(val).trim().toUpperCase();
            let multiplier = 1;

            if (str.endsWith('K')) { 
                multiplier = 1000; 
                str = str.slice(0, -1); 
            } else if (str.endsWith('M')) { 
                multiplier = 1000000; 
                str = str.slice(0, -1); 
            }

            str = str.replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? 0 : Math.round(num * multiplier);
        }

        function formatDisplayPoints(total) {
            if (total >= 1000000) {
                let mVal = total / 1000000;
                return mVal.toFixed(1).replace('.', ',') + 'M';
            } else if (total >= 1000) {
                let kVal = total / 1000;
                return kVal.toFixed(1).replace('.', ',') + 'K';
            }
            return total.toLocaleString('id-ID');
        }

        function formatShortName(name) {
            if (!name) return "";
            if (name.length > 8) {
                let halfLength = Math.ceil(name.length / 2);
                return name.substring(0, halfLength) + "...";
            }
            return name;
        }

        uploadVideo.onended = () => {
            uploadVideo.pause();
            uploadVideo.currentTime = 0;
            uploadVideo.style.display = 'none';
        };

        channel.onmessage = (event) => {
            const { type, data, url } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                bgVideo.pause();
                bgVideo.currentTime = 0;
                bgVideo.src = url;
                bgVideo.style.display = 'block';
                bgVideo.load();
                bgVideo.muted = false; 
                bgVideo.play().catch(e => {
                    bgVideo.muted = true;
                    bgVideo.play();
                });
            }

            if (type === 'UPDATE_GS_VIDEO') {
                uploadVideo.pause();
                uploadVideo.currentTime = 0;
                uploadVideo.src = url;
                uploadVideo.style.display = 'block';
                uploadVideo.load();
                uploadVideo.muted = false; 
                uploadVideo.play().catch(e => {
                    uploadVideo.muted = true;
                    uploadVideo.play();
                });
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                const micSvgHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        <line x1="3" y1="3" x2="21" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                `;

                if (data.clear) {
                    slotEl.dataset.points = "0";
                    slotEl.classList.remove('active-slot');
                    slotEl.innerHTML = `
                        <div class="slot-star-number-group" style="display: none;">
                            <div class="slot-star-circle-small"><span class="star-icon">★</span></div>
                            <div class="slot-number-text">0</div>
                        </div>
                        <img class="gift-popup-effect" alt="Gift Popup">
                        <div class="mic-icon-bottom-right" style="display: none;">${micSvgHTML}</div>
                        <span class="plus">+</span><span class="label">Permintaan</span>
                    `;
                } else {
                    slotEl.dataset.points = "0";
                    slotEl.classList.add('active-slot');
                    const processedName = formatShortName(data.name);
                    slotEl.innerHTML = `
                        <div class="slot-star-number-group" style="display: flex;">
                            <div class="slot-star-circle-small"><span class="star-icon">★</span></div>
                            <div class="slot-number-text">0</div>
                        </div>
                        <img class="gift-popup-effect" alt="Gift Popup">
                        <div class="mic-icon-bottom-right" style="display: flex;">${micSvgHTML}</div>
                        <div class="slot-content"><img src="${data.photo}" class="slot-avatar" alt="Avatar"></div>
                        <div class="slot-name-bottom"><span class="name-text">${processedName}</span><span class="plus-icon-large">✚</span></div>
                    `;
                }
            }

            if (type === 'ADD_POINTS_TO_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                let pointToAdd = data.addPoints;
                if (data.giftName === "Kota Masa Depan" && (!pointToAdd || parseFlexiblePoints(pointToAdd) === 0)) {
                    pointToAdd = 6000;
                } else if ((data.giftName === "Legend Marcellus" || data.giftName === "Pegasus") && (!pointToAdd || parseFlexiblePoints(pointToAdd) === 0)) {
                    pointToAdd = 42999;
                }

                const addedValue = parseFlexiblePoints(pointToAdd);
                let currentPoints = parseInt(slotEl.dataset.points || "0") + addedValue;
                slotEl.dataset.points = currentPoints;

                const numberText = slotEl.querySelector('.slot-number-text');
                const groupEl = slotEl.querySelector('.slot-star-number-group');
                const giftPopup = slotEl.querySelector('.gift-popup-effect');

                if (numberText) numberText.innerText = formatDisplayPoints(currentPoints);
                if (groupEl) groupEl.style.display = 'flex';

                let resolvedGiftIcon = data.giftIcon;
                if (data.giftName && giftDatabase[data.giftName]) {
                    resolvedGiftIcon = giftDatabase[data.giftName];
                }

                if (giftPopup && resolvedGiftIcon) {
                    giftPopup.src = resolvedGiftIcon;
                    giftPopup.style.display = 'block';
                    giftPopup.style.animation = 'none';
                    void giftPopup.offsetWidth; 
                    giftPopup.style.animation = 'giftPopupAnim 3s ease forwards';
                }
            }
        };
    </script>
</body>
</html>
